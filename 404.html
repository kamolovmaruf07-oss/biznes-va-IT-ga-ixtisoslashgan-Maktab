<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahifa topilmadi — Biznes va IT Maktab</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('bit-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
</head>
<body>
<main class="error-page">
  <div class="container error-page__inner">
    <span class="eyebrow">Xato 404</span>
    <h1>Bu sahifa topilmadi</h1>
    <p>Siz izlagan sahifa o'chirilgan yoki manzil o'zgargan bo'lishi mumkin. Bosh sahifaga qaytib, kerakli bo'limni tanlang.</p>
    <div class="error-page__actions">
      <a class="btn btn-primary" href="/">Bosh sahifa</a>
      <a class="btn btn-ghost" href="/#courses">Yo'nalishlar</a>
      <a class="btn btn-ghost" href="/#contact">Aloqa</a>
    </div>
  </div>
</main>
</body>
</html>
